name: Tinker Build

# Personal tinker loop: build the `default` firmware on every push and attach
# the .bin to a `load-<run>` release so it can be downloaded from anywhere.
# Needs no repository secrets — GITHUB_TOKEN with contents:write is enough.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
      - "tinker/**"
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build firmware
        run: pio run -e default

      - name: Name firmware binary
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          NAME="firmware-tiny-load${{ github.run_number }}-${SHA}.bin"
          cp .pio/build/default/firmware.bin "$NAME"
          echo "FIRMWARE=$NAME" >> "$GITHUB_ENV"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-load${{ github.run_number }}
          path: ${{ env.FIRMWARE }}

      - name: Publish load release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: load-${{ github.run_number }}
          name: "Load ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Tinker load built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            Flash: download the `.bin`, connect the device via USB-C, then use
            **Custom .bin** at https://crosspointreader.com/#flash-tools
            (or `esptool.py --chip esp32c3 --port <port> --baud 921600 write_flash 0x10000 <file>`).
          files: ${{ env.FIRMWARE }}
